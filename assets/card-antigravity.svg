<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 140" width="100%">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="glow-antigravity" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-weight: 700; font-size: 16px; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 11.5px; fill: #94A3B8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 10px; font-weight: 500; fill: #CBD5E1; }
  </style>

  <!-- Base Glass Card -->
  <rect x="4" y="4" width="382" height="132" rx="16" fill="#0C101A" filter="url(#cardShadow)" />
  <rect x="4" y="4" width="382" height="132" rx="16" fill="url(#glow-antigravity)" />
  <rect x="4" y="4" width="382" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Top Glass Highlight Line -->
  <path d="M 20 5 L 370 5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round" />

  <!-- Icon: Antigravity Orb & Orbit -->
  <g transform="translate(24, 22)">
    <rect width="36" height="36" rx="10" fill="#8B5CF6" fill-opacity="0.18" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1" />
    <!-- Orbit Rings -->
    <ellipse cx="18" cy="18" rx="11" ry="5" stroke="#A78BFA" stroke-width="1.4" fill="none" transform="rotate(-25 18 18)" />
    <circle cx="18" cy="18" r="4" fill="#C4B5FD" />
  </g>

  <!-- Title & Pin Badge -->
  <text x="70" y="38" fill="url(#textGrad)" class="title">antigravityide2api</text>
  <g transform="translate(332, 22)">
    <rect width="36" height="18" rx="9" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="10" y="13" fill="#C4B5FD" font-size="9.5" font-family="-apple-system, sans-serif" font-weight="600">PIN</text>
  </g>

  <!-- Description -->
  <text x="24" y="78" class="desc">Antigravity IDE to API bridge &amp; reverse engineering</text>
  <text x="24" y="94" class="desc">interface wrapper for programmatic tool calling.</text>

  <!-- Tags / Badges -->
  <g transform="translate(24, 108)">
    <rect width="64" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.08" />
    <text x="10" y="13" class="tag">AI Bridge</text>

    <rect x="70" width="76" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.08" />
    <text x="80" y="13" class="tag">IDE Gateway</text>

    <rect x="152" width="60" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.08" />
    <text x="162" y="13" class="tag">Node.js</text>
  </g>
</svg>
