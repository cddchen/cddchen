<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 140" width="100%">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="glow-bilibili" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-weight: 700; font-size: 16px; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 11.5px; fill: #94A3B8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 10px; font-weight: 500; fill: #CBD5E1; }
  </style>

  <!-- Base Glass Card -->
  <rect x="4" y="4" width="382" height="132" rx="16" fill="#0C101A" filter="url(#cardShadow)" />
  <rect x="4" y="4" width="382" height="132" rx="16" fill="url(#glow-bilibili)" />
  <rect x="4" y="4" width="382" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Top Glass Highlight Line -->
  <path d="M 20 5 L 370 5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round" />

  <!-- Icon: Video Play & Subtitles -->
  <g transform="translate(24, 22)">
    <rect width="36" height="36" rx="10" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1" />
    <!-- TV / Video monitor screen -->
    <rect x="9" y="11" width="18" height="13" rx="2" stroke="#38BDF8" stroke-width="1.4" fill="none" />
    <polygon points="16,15 21,17.5 16,20" fill="#38BDF8" />
    <line x1="14" y1="27" x2="22" y2="27" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Title & Pin Badge -->
  <text x="70" y="38" fill="url(#textGrad)" class="title">bilibili-study</text>
  <g transform="translate(332, 22)">
    <rect width="36" height="18" rx="9" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="10" y="13" fill="#38BDF8" font-size="9.5" font-family="-apple-system, sans-serif" font-weight="600">PIN</text>
  </g>

  <!-- Description -->
  <text x="24" y="78" class="desc">Bilibili video study companion: online subtitle capture,</text>
  <text x="24" y="94" class="desc">offline speech recognition &amp; bi-directional sync.</text>

  <!-- Tags / Badges -->
  <g transform="translate(24, 108)">
    <rect width="102" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.08" />
    <text x="10" y="13" class="tag">Chrome Extension</text>

    <rect x="108" width="76" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.08" />
    <text x="118" y="13" class="tag">Subtitle Sync</text>

    <rect x="190" width="72" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.08" />
    <text x="200" y="13" class="tag">JavaScript</text>
  </g>
</svg>
